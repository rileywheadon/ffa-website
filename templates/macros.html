{% macro spinner() %}

<!-- NOTE: The spinner appears when LEAVING the current page. -->
<div x-show="loading" class="flex flex-col items-center justify-center h-full gap-y-4">
	<div class="w-16 h-16 border-8 border-gray-300 border-t-sky-600 rounded-full animate-spin">

	</div>
	<div x-text="loading_message">

	</div>
</div>

{% endmacro %}

{% macro tooltip(main_text, hover_text) %}

<!-- Tooltip component -->
<div
  x-data="{ open: false }"
  class="relative inline-block"
  @mouseenter="open = true"
  @mouseleave="open = false"
>

  <!-- The word or element you want the tooltip on -->
  <span class="underline cursor-pointer">{{ main_text }}</span>

  <!-- Tooltip itself -->
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 translate-y-1"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-1"
    class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 bg-gray-800 text-white text-sm px-2 py-1 rounded shadow-lg whitespace-nowrap z-10"
    style="display: none;"
  >{{ hover_text }}</div>

</div>{% endmacro %}
