<p><span class="font-semibold">File</span>: {{ results.file_name }}</p>

<table>
	<tr>
		<td class="py-1 px-4 border border-gray-300">Years</td>
		<td class="py-1 px-4 border border-gray-300">{{ results.years_min }}-{{ results.years_max }}</td>
	</tr>
	<tr>
		<td class="py-1 px-4 border border-gray-300">Minimum</td>
		<td class="py-1 px-4 border border-gray-300">{{ results.data_min }}</td>
	</tr>
	<tr>
		<td class="py-1 px-4 border border-gray-300">Median</td>
		<td class="py-1 px-4 border border-gray-300">{{ results.data_med }}</td>			
	</tr>
	<tr>
		<td class="py-1 px-4 border border-gray-300">Maximum</td>
		<td class="py-1 px-4 border border-gray-300">{{ results.data_max }}</td>
	</tr>
	<tr>
		<td class="py-1 px-4 border border-gray-300"># of Missing Values</td>
		<td class="py-1 px-4 border border-gray-300">{{ results.missing_count }}</td>
	</tr>
</table>
