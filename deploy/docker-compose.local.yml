services:
  caddy:
    ports:
      - "8080:80" 
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  flask:
    # live-mount your working tree (optional but convenient)
    volumes:
      - ..:/app

  plumber:
    # expose Plumber for testing only (not used in production)
    ports:
      - "8000:8000"

